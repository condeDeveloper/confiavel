name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: o fluxo que chega e exatamente o que saiu
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: a janela que passa da metade do espaco de numeros
        run: mvn -B -ntp -q exec:java -Dexec.args="numeracao"

      - name: quanto cada protocolo gasta com perda
        run: mvn -B -ntp -q exec:java -Dexec.args="custo"

      - name: a janela que o enlace comporta
        run: mvn -B -ntp -q exec:java -Dexec.args="enchendo"

      - name: o que o reconhecimento acumulado esconde
        run: mvn -B -ntp -q exec:java -Dexec.args="reconhecimento"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
